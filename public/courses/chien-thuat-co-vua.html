<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa Học Chiến Thuật Và Đòn Phối Hợp Cờ Vua - Trí Tuệ Và Nhạy Bén</title>
    
    <!-- Google Fonts: Lora & Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* HỆ THỐNG THIẾT KẾ CỐT LÕI (DESIGN SYSTEM) - GIAO DIỆN SÁNG MÀU VÀNG HỔ PHÁCH SANG TRỌNG */
        :root {
            --bg-primary: #FFFBEB;       /* Tông nền vàng hổ phách nhạt ấm áp */
            --bg-secondary: #FFFFFF;     /* Trắng tinh khiết cho thẻ */
            --bg-tertiary: #FEF3C7;      /* Màu nền vàng hổ phách phụ */
            --border-color: rgba(217, 119, 6, 0.12);
            --border-hover: rgba(217, 119, 6, 0.25);
            
            --text-primary: #451A03;     /* Nâu đen hổ phách đậm */
            --text-secondary: #78350F;   /* Nâu hổ phách ấm */
            --text-muted: #B45309;       /* Nâu vàng đất nhạt */
            
            --brand-600: #D97706;        /* Vàng hổ phách nhấn chính */
            --brand-700: #B45309;        /* Vàng hổ phách đậm */
            --brand-glow: rgba(217, 119, 6, 0.08);
            
            --accent-solid: #0284C7;     /* Xanh trời ghim gạch */
            --accent-glow: rgba(2, 132, 199, 0.08);
            
            --success-solid: #15803D;    /* Xanh lục đậm */
            --success-glow: rgba(21, 128, 61, 0.08);
            
            --error-solid: #B91C1C;      /* Đỏ gạch nung */
            --error-glow: rgba(185, 28, 28, 0.08);
            
            /* Màu sắc của bàn cờ gỗ cổ điển */
            --board-light: #F0D9B5;      /* Ô kem gỗ nhạt */
            --board-dark: #B58863;       /* Ô nâu gỗ trầm */
            --board-border: #78350F;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-move: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            --shadow-md: 0 4px 6px -1px rgba(217, 119, 6, 0.03), 0 2px 4px -2px rgba(217, 119, 6, 0.02);
            --shadow-lg: 0 10px 25px -5px rgba(217, 119, 6, 0.06), 0 8px 10px -6px rgba(217, 119, 6, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* KHUNG CHƯƠNG TRÌNH */
        .app-container {
            display: grid;
            grid-template-rows: 70px 1fr;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
            box-shadow: var(--shadow-md);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--brand-700);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.01em;
        }

        .logo i {
            color: var(--brand-600);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--bg-tertiary);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            margin-left: 20px;
        }

        .progress-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-bar-track {
            width: 120px;
            height: 6px;
            background-color: rgba(217, 119, 6, 0.08);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--brand-700), var(--brand-600));
            width: 20%; /* 1/5 */
            border-radius: var(--radius-full);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-percent {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--brand-600);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* NÚT BẤM */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid transparent;
            outline: none;
            user-select: none;
        }

        .btn-outline {
            background-color: #FFFFFF;
            border-color: var(--border-color);
            color: var(--text-secondary);
            box-shadow: 0 2px 4px rgba(217, 119, 6, 0.04);
        }

        .btn-outline:hover {
            border-color: var(--brand-600);
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
        }

        .btn-primary {
            background-color: var(--brand-700);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(180, 83, 9, 0.15);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--brand-600);
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.25);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* PHẦN THÂN GIAO DIỆN CHÍNH */
        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            height: 100%;
            overflow: hidden;
        }

        /* KHU VỰC BÀN CỜ (CỘT TRÁI) */
        .board-workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-primary);
            padding: 30px;
            position: relative;
        }

        .board-outer {
            position: relative;
            padding: 24px;
            background-color: #E2CEB7; /* Viền bao ngoài gỗ nhạt */
            border: 3px solid var(--brand-700);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Khung chứa các toạ độ dọc */
        .coords-y {
            position: absolute;
            left: 6px;
            top: 24px;
            bottom: 24px;
            width: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--brand-700);
        }

        /* Khung chứa các toạ độ ngang */
        .coords-x {
            position: absolute;
            bottom: 4px;
            left: 24px;
            right: 24px;
            height: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--brand-700);
        }

        .board-grid-wrapper {
            position: relative;
            width: min(520px, 70vh);
            height: min(520px, 70vh);
        }

        .chessboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(120, 53, 15, 0.2);
            background-color: var(--board-light);
        }

        .square {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .square.light {
            background-color: var(--board-light);
        }

        .square.dark {
            background-color: var(--board-dark);
        }

        /* Lớp phát sáng đường đi ghim hoặc ăn quân chiến thuật */
        .square.highlight-tactical::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(2, 132, 199, 0.2);
            pointer-events: none;
            box-shadow: inset 0 0 8px rgba(2, 132, 199, 0.4);
            animation: pulse-tactical 1.5s infinite;
        }

        @keyframes pulse-tactical {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Điểm phát sáng nước đi hợp lệ */
        .square.highlight-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22%;
            height: 22%;
            border-radius: var(--radius-full);
            background-color: rgba(217, 119, 6, 0.85);
            pointer-events: none;
            box-shadow: 0 0 6px rgba(217, 119, 6, 0.5);
        }

        /* Nước ăn quân hợp lệ */
        .square.highlight-dot.has-opponent::after {
            width: 70%;
            height: 70%;
            border-radius: var(--radius-full);
            background-color: transparent;
            border: 4px solid rgba(217, 119, 6, 0.95);
            box-shadow: none;
        }

        /* CÁC QUÂN CỜ VẼ BẰNG TUYỆT ĐỐI */
        .pieces-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .chess-piece {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            transition: var(--transition-move);
            z-index: 10;
        }

        .chess-piece svg {
            width: 82%;
            height: 82%;
            filter: drop-shadow(0 2px 4px rgba(120, 53, 15, 0.2));
            transition: var(--transition-fast);
        }

        .chess-piece:hover svg {
            transform: scale(1.1);
        }

        .chess-piece.selected {
            z-index: 20;
        }

        .chess-piece.selected svg {
            transform: scale(1.15) translateY(-4px);
            filter: drop-shadow(0 8px 12px rgba(217, 119, 6, 0.35));
        }

        /* Rung lắc khi di chuyển sai */
        .chess-piece.shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* BẢNG ĐIỀU KHIỂN & BÀI HỌC (CỘT PHẢI) */
        .control-panel {
            background-color: var(--bg-secondary);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: -4px 0 15px rgba(217, 119, 6, 0.02);
        }

        /* Danh mục chọn nhanh chiến thuật */
        .chapters-dropdown {
            border-bottom: 2px solid var(--border-color);
            padding: 16px 24px;
            background-color: var(--bg-tertiary);
        }

        .chapters-selector {
            width: 100%;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            background-color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brand-700);
            outline: none;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .chapters-selector:hover {
            border-color: var(--brand-600);
        }

        /* Nội dung bài học */
        .lesson-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .lesson-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lesson-chapter-tag {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--brand-600);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .lesson-title {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--brand-700);
            line-height: 1.3;
        }

        .lesson-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .lesson-text p {
            margin-bottom: 12px;
        }

        .lesson-text strong {
            color: var(--brand-700);
        }

        /* Thẻ mục tiêu thử thách */
        .objective-card {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(217, 119, 6, 0.02);
        }

        .objective-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .objective-header i {
            color: var(--accent-solid);
        }

        .objective-item {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .objective-status {
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-weight: 800;
        }

        .status-incomplete {
            background-color: rgba(2, 132, 199, 0.08);
            color: var(--accent-solid);
        }

        .status-complete {
            background-color: rgba(21, 128, 61, 0.08);
            color: var(--success-solid);
            animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce-in {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Hộp thoại chúc mừng */
        .feedback-balloon {
            background-color: rgba(21, 128, 61, 0.04);
            border: 2px solid var(--success-solid);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: none;
            align-items: flex-start;
            gap: 16px;
            animation: slide-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .feedback-balloon.active {
            display: flex;
        }

        .feedback-icon {
            font-size: 1.8rem;
            color: var(--success-solid);
        }

        .feedback-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .feedback-title {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--success-solid);
        }

        .feedback-desc {
            font-size: 0.85rem;
            line-height: 1.55;
            color: var(--text-secondary);
        }

        @keyframes slide-in {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* THANH ĐIỀU HƯỚNG DƯỚI */
        .footer-nav {
            height: 80px;
            border-top: 2px solid var(--border-color);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-tertiary);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo"><i class="fa-solid fa-brain"></i> Chiến Thuật Cờ Vua</h1>
                
                <div class="progress-container">
                    <span class="progress-label">Tiến trình</span>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                    <span class="progress-percent" id="progressPercent">20%</span>
                </div>
            </div>
            
            <div class="header-right">
                <button class="btn btn-outline" id="resetStepBtn">
                    <i class="fa-solid fa-rotate-left"></i> Thiết lập lại thế cờ
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <main class="main-layout">
            <!-- CỘT TRÁI - BÀN CỜ ĐỘNG -->
            <section class="board-workspace">
                <div class="board-outer">
                    <!-- Tọa độ dọc -->
                    <div class="coords-y">
                        <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
                    </div>
                    
                    <!-- Lưới bàn cờ -->
                    <div class="board-grid-wrapper">
                        <div class="chessboard" id="chessboardGrid">
                            <!-- Sinh tự động bằng JS -->
                        </div>
                        
                        <!-- Lớp quân cờ -->
                        <div class="pieces-layer" id="piecesLayer">
                            <!-- Các quân cờ render động -->
                        </div>
                    </div>
                    
                    <!-- Tọa độ ngang -->
                    <div class="coords-x">
                        <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
                    </div>
                </div>
            </section>

            <!-- CỘT PHẢI - NỘI DUNG CHIẾN THUẬT -->
            <section class="control-panel">
                <!-- Chọn chương nhanh -->
                <div class="chapters-dropdown">
                    <select class="chapters-selector" id="stepSelector">
                        <!-- Tự động sinh -->
                    </select>
                </div>
                
                <!-- Nội dung thuyết minh -->
                <div class="lesson-content">
                    <div class="lesson-header">
                        <span class="lesson-chapter-tag" id="lessonChapterTag">Chương 1</span>
                        <h2 class="lesson-title" id="lessonTitle">Tên bài học</h2>
                    </div>
                    
                    <div class="lesson-text" id="lessonText">
                        <!-- Văn bản thuyết minh -->
                    </div>
                    
                    <!-- Thử thách tương tác -->
                    <div class="objective-card" id="objectiveCard">
                        <span class="objective-header">
                            <i class="fa-solid fa-circle-question"></i> Tìm đòn chiến thuật
                        </span>
                        <div class="objective-item">
                            <span id="objectiveText">Nhiệm vụ đi cờ</span>
                            <span class="objective-status status-incomplete" id="objectiveStatus">Nước 1/2</span>
                        </div>
                    </div>
                    
                    <!-- Bong bóng phản hồi chúc mừng -->
                    <div class="feedback-balloon" id="feedbackBalloon">
                        <div class="feedback-icon">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <div class="feedback-info">
                            <span class="feedback-title" id="feedbackTitle">Giải chính xác!</span>
                            <span class="feedback-desc" id="feedbackDesc">Phản hồi sư phạm</span>
                        </div>
                    </div>
                </div>
                
                <!-- Thanh điều hướng cuối -->
                <footer class="footer-nav">
                    <button class="btn btn-outline" id="prevBtn">
                        <i class="fa-solid fa-chevron-left"></i> Quay lại
                    </button>
                    <button class="btn btn-primary" id="nextBtn" disabled>
                        Tiếp tục <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </footer>
            </section>
        </main>
    </div>

    <!-- CODE LOGIC CHIẾN THUẬT CỜ VUA -->
    <script>
        // Vector quân cờ chuẩn Wikipedia

        function playWoodTapSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.09);
                
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch (e) {
                console.log("Audio Error: ", e);
            }
        }

        function playChimeSound(isSuccess) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (isSuccess) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12); // G5
                    osc.frequency.setValueAtTime(987.77, ctx.currentTime + 0.24); // B5
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(130, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {
                console.log("Audio Error: ", e);
            }

                feedback: "Kỳ diệu! Nước đi Bxc6+ giải phóng cột dọc e cho Xe e1 chiếu Vua đen. Vua đen bắt buộc phải né tránh sang d8 và không có thời gian để ăn lại Tượng trắng, giúp Trắng bắt Hậu miễn phí."
            },
            {
                chapter: "Chương 5: Đòn thu hút",
                title: "Đòn thu hút - Dụ đối phương vào bẫy",
                text: `
                    <p><strong>Đòn thu hút</strong> là kỹ thuật ép buộc một quân cờ đối phương (thường là Vua) phải di chuyển sang một ô cờ bất lợi cho họ để chuẩn bị cho đòn phối hợp quyết định của ta.</p>
                    <p><strong>Bối cảnh thế cờ:</strong> Vua đen đang an toàn ở g8. Trắng có Hậu ở h5 và Mã ở f6. Trắng muốn thực hiện đòn đâm đôi bằng Mã nhưng Vua đen chưa ở vị trí thuận lợi.</p>
                    <p><strong>Nhiệm vụ:</strong> Thực hiện chuỗi phối hợp 2 nước đi thu hút Vua đen vào bẫy:</p>
                    <ol>
                        <li>Di chuyển Hậu trắng h5 lên ô **h8** chiếu Vua để ép Vua đen ăn Hậu (thu hút Vua lên h8).</li>
                        <li>Di chuyển Mã f6 nhảy lên ô **f7** thực hiện đòn đâm đôi chiếu Vua và bắt Hậu đen d8.</li>
                    </ol>
                `,
                pieces: {
                    "g8": "k", "d8": "q", "h5": "Q", "f6": "N", "g1": "K"
                },
                moves: [
                    { from: "h5", to: "h8", reply: { from: "g8", to: "h8" }, instruction: "Bước 1: Hãy hiến Hậu trắng từ h5 lên <strong>h8</strong> để thu hút Vua đen." },
                    { from: "f6", to: "f7", reply: null, instruction: "Bước 2: Vua đen đã ăn Hậu ở h8. Hãy di chuyển Mã f6 lên <strong>f7</strong> chiếu Vua và bắt Hậu d8." }
                ],
                feedback: "Đẳng cấp đại kiện tướng! Nước đi thí Hậu Qh8+ thành công thu hút Vua đen lên ô h8. Nước nhảy Mã Nf7+ tiếp nối thực hiện đòn đâm đôi kinh điển chiếu Vua và bắt lại Hậu d8 ở nước sau."
            }
        ];

        // Biến trạng thái
        let currentStepIndex = 0;
        let boardState = {};
        let currentMoveIndex = 0;
        let selectedSquare = null;
        let isStepCompleted = false;

        // DOM elements
        const chessboardGrid = document.getElementById('chessboardGrid');
        const piecesLayer = document.getElementById('piecesLayer');
        const stepSelector = document.getElementById('stepSelector');
        const lessonChapterTag = document.getElementById('lessonChapterTag');
        const lessonTitle = document.getElementById('lessonTitle');
        const lessonText = document.getElementById('lessonText');
        const objectiveText = document.getElementById('objectiveText');
        const objectiveStatus = document.getElementById('objectiveStatus');
        const feedbackBalloon = document.getElementById('feedbackBalloon');
        const feedbackDesc = document.getElementById('feedbackDesc');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetStepBtn = document.getElementById('resetStepBtn');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');

        const cols = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

        // Khởi tạo bàn cờ
        function initChessboardUI() {
            chessboardGrid.innerHTML = '';
            for (let r = 7; r >= 0; r--) {
                for (let c = 0; c < 8; c++) {
                    const coord = cols[c] + (r + 1);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(c + r) % 2 === 0 ? 'dark' : 'light'}`;
                    squareDiv.dataset.coord = coord;
                    squareDiv.id = `square-${coord}`;
                    squareDiv.addEventListener('click', () => handleSquareClick(coord));
                    chessboardGrid.appendChild(squareDiv);
                }
            }
        }

        // Vẽ các quân cờ
        function renderPieces() {
            piecesLayer.innerHTML = '';
            for (const [coord, piece] of Object.entries(boardState)) {
                if (!piece) continue;
                
                const [c, r] = parseCoord(coord);
                const left = c * 12.5;
                const top = (7 - r) * 12.5;
                
                const pieceDiv = document.createElement('div');
                pieceDiv.className = `chess-piece ${piece === piece.toUpperCase() ? 'white' : 'black'}`;
                pieceDiv.dataset.coord = coord;
                pieceDiv.dataset.piece = piece;
                pieceDiv.style.left = `${left}%`;
                pieceDiv.style.top = `${top}%`;
                pieceDiv.innerHTML = PIECE_SVGS[piece];
                
                pieceDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleSquareClick(coord);
                });
                
                piecesLayer.appendChild(pieceDiv);
            }
        }

        function parseCoord(coord) {
            const col = cols.indexOf(coord[0]);
            const row = parseInt(coord[1]) - 1;
            return [col, row];
        }

        // Click tương tác
        function handleSquareClick(coord) {
            if (isStepCompleted) return;

            const step = STEPS[currentStepIndex];
            const currentMove = step.moves[currentMoveIndex];
            const piece = boardState[coord];

            const expectedFrom = currentMove.from;
            const isExpectedPiece = (coord === expectedFrom);

            // Chọn quân cờ
            if (isExpectedPiece) {
                clearHighlights();
                selectedSquare = coord;
                
                const pieceEl = document.querySelector(`.chess-piece[data-coord="${coord}"]`);
                if (pieceEl) pieceEl.classList.add('selected');

                // Chỉ hiển thị ô đi hợp lệ duy nhất của thế cờ giải
                highlightValidSquares([currentMove.to]);
            } 
            // Thực hiện di chuyển
            else if (selectedSquare && coord === currentMove.to) {
                executeMove(selectedSquare, coord);
            } 
            else {
                clearHighlights();
                if (piece) {
                    const pieceEl = document.querySelector(`.chess-piece[data-coord="${coord}"]`);
                    if (pieceEl) {
                        pieceEl.classList.add('shake');
                        playChimeSound(false);
                        setTimeout(() => pieceEl.classList.remove('shake'), 400);
                    }
                }
                selectedSquare = null;
            }
        }

        // Thực thi nước đi
        function executeMove(from, to) {
            const step = STEPS[currentStepIndex];
            const currentMove = step.moves[currentMoveIndex];
            const piece = boardState[from];
            const captured = boardState[to];

            boardState[to] = piece;
            delete boardState[from];

            clearHighlights();

            const pieceEl = document.querySelector(`.chess-piece[data-coord="${from}"]`);
            if (pieceEl) {
                const [c, r] = parseCoord(to);
                pieceEl.style.left = `${c * 12.5}%`;
                pieceEl.style.top = `${(7 - r) * 12.5}%`;
                pieceEl.dataset.coord = to;

                if (captured) {
                    const opponentEl = document.querySelector(`.chess-piece[data-coord="${to}"]:not(.selected)`);
                    if (opponentEl) {
                        opponentEl.style.transform = 'scale(0)';
                        setTimeout(() => opponentEl.remove(), 300);
                    }
                }
            }

            playWoodTapSound();

            selectedSquare = null;
            currentMoveIndex++;

            // Phản hồi tự động của máy tính
            if (currentMove.reply) {
                objectiveStatus.innerText = "Đối thủ đang đi cờ...";
                setTimeout(() => {
                    const reply = currentMove.reply;
                    const replyPiece = boardState[reply.from];
                    
                    boardState[reply.to] = replyPiece;
                    delete boardState[reply.from];
                    
                    const replyPieceEl = document.querySelector(`.chess-piece[data-coord="${reply.from}"]`);
                    if (replyPieceEl) {
                        const [rc, rr] = parseCoord(reply.to);
                        replyPieceEl.style.left = `${rc * 12.5}%`;
                        replyPieceEl.style.top = `${(7 - rr) * 12.5}%`;
                        replyPieceEl.dataset.coord = reply.to;
                    }
                    
                    playWoodTapSound();
                    
                    setTimeout(() => {
                        renderPieces();
                        updateObjectiveProgress();
                    }, 300);
                    
                }, 600);
            } else {
                setTimeout(() => {
                    renderPieces();
                    updateObjectiveProgress();
                }, 300);
            }
        }

        function highlightValidSquares(moves) {
            moves.forEach(m => {
                const sq = document.getElementById(`square-${m}`);
                if (sq) {
                    sq.classList.add('highlight-dot');
                    if (boardState[m]) {
                        sq.classList.add('has-opponent');
                    }
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('highlight-dot', 'has-opponent', 'highlight-tactical');
            });
            document.querySelectorAll('.chess-piece').forEach(pc => {
                pc.classList.remove('selected');
            });
        }

        // Cập nhật tiến trình thử thách
        function updateObjectiveProgress() {
            const step = STEPS[currentStepIndex];
            
            if (currentMoveIndex < step.moves.length) {
                const nextMove = step.moves[currentMoveIndex];
                objectiveText.innerHTML = nextMove.instruction;
                objectiveStatus.innerText = `Nước ${currentMoveIndex + 1}/${step.moves.length}`;
                
                highlightStrategicLines();
            } else {
                isStepCompleted = true;
                playChimeSound(true);
                
                objectiveStatus.className = "objective-status status-complete";
                objectiveStatus.innerHTML = `<i class="fa-solid fa-trophy"></i> Đã hoàn thành`;
                nextBtn.disabled = false;
                
                feedbackBalloon.classList.add('active');
                feedbackDesc.innerText = step.feedback;
            }
        }

        // Vẽ các vùng/đường phát sáng chiến thuật đặc biệt
        function highlightStrategicLines() {
            clearHighlights();
            
            // Bài 2: Đòn giằng - Phát sáng hàng dọc e
            if (currentStepIndex === 1) {
                const pinLine = ["e2", "e3", "e4", "e5", "e6", "e7", "e8"];
                pinLine.forEach(c => {
                    const sq = document.getElementById(`square-${c}`);
                    if (sq) sq.classList.add('highlight-tactical');
                });
            }
            // Bài 3: Đòn xiên - Phát sáng đường chéo lớn
            else if (currentStepIndex === 2 && currentMoveIndex === 0) {
                const skewerLine = ["a1", "b2", "c3", "d4", "e5", "f6", "g7", "h8"];
                skewerLine.forEach(c => {
                    const sq = document.getElementById(`square-${c}`);
                    if (sq) sq.classList.add('highlight-tactical');
                });
            }
        }

        // --- 4. TẢI THẾ CỜ ---
        function loadStep(index) {
            currentStepIndex = index;
            isStepCompleted = false;
            currentMoveIndex = 0;
            selectedSquare = null;
            
            const step = STEPS[index];

            lessonChapterTag.innerText = step.chapter;
            lessonTitle.innerText = step.title;
            lessonText.innerHTML = step.text;
            
            objectiveText.innerHTML = step.moves[0].instruction;
            objectiveStatus.className = "objective-status status-incomplete";
            objectiveStatus.innerText = `Nước 1/${step.moves.length}`;
            
            feedbackBalloon.classList.remove('active');
            nextBtn.disabled = true;
            stepSelector.value = index;

            boardState = JSON.parse(JSON.stringify(step.pieces));
            clearHighlights();
            renderPieces();

            const progress = ((index + 1) / STEPS.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercent.innerText = `${Math.round(progress)}%`;

            prevBtn.disabled = (index === 0);

            // Chạy hiệu ứng xuất hiện
            runPieceTransitionEffects();
            highlightStrategicLines();
        }

        function runPieceTransitionEffects() {
            document.querySelectorAll('.chess-piece').forEach((el, i) => {
                el.style.opacity = '0';
                el.style.transform = 'scale(0.6) translateY(-20px)';
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'scale(1) translateY(0)';
                }, i * 30);
            });
        }

        function initStepSelectorUI() {
            stepSelector.innerHTML = '';
            STEPS.forEach((step, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${idx + 1}. ${step.title}`;
                stepSelector.appendChild(opt);
            });
            
            stepSelector.addEventListener('change', function() {
                loadStep(parseInt(this.value));
            });
        }

        prevBtn.addEventListener('click', () => {
            if (currentStepIndex > 0) loadStep(currentStepIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentStepIndex < STEPS.length - 1) {
                loadStep(currentStepIndex + 1);
            } else {
                alert("Chúc mừng bạn đã hoàn thành xuất sắc toàn bộ khóa học Chiến thuật cờ vua!");
            }
        });

        resetStepBtn.addEventListener('click', () => {
            loadStep(currentStepIndex);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initChessboardUI();
            initStepSelectorUI();
            loadStep(0);
        });
    </script>
<script>
  // Deep-link for embedding in the learn page: ?step=N opens lesson N (0-based).
  // The module inits on window DOMContentLoaded and calls loadStep(0); defer to
  // a macrotask so this runs AFTER that init and wins.
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      try {
        var n = parseInt(new URLSearchParams(location.search).get('step'), 10);
        if (!isNaN(n) && n > 0 && typeof loadStep === 'function') loadStep(n);
      } catch (e) {}
    }, 0);
  });
</script>
</body>
